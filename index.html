<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Per la mia principessa ♥</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #0b0c10;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    pre#screen {
      font-family: "Consolas", "Courier New", monospace;
      line-height: 1.05;
      letter-spacing: 0px;
      user-select: none;
      white-space: pre;
    }
  </style>
</head>
<body>
  <pre id="screen"></pre>

  <script>
    const SPIN_SPEED = 0.6;
    const TILT = 0.30;
    const CAM_DIST = 4.0;
    const MESSAGE = "ti amo ♥";
    const HINT = "per la mia principessa";
    const NUM_HEARTS = 18;
    const PIVOT_Y = 0.2;

    const WHITE = [244, 248, 251, 254, 255, 231];
    const PINK = [125, 162, 168, 205, 211, 218, 225];
    const RED = [52, 88, 124, 160, 196, 203];
    const PURPLE = [54, 91, 97, 134, 140, 183];
    const YELLOW = [136, 178, 214, 220, 226, 229];
    const ORANGE = [130, 166, 202, 208, 214, 216];
    const GOLD_CENTER = [94, 136, 178, 214, 220];
    const DARK_CENTER = [52, 58, 94, 130, 136];
    const GREENS = [22, 28, 28, 34, 35, 71, 77, 114];
    const PAPER = [101, 144, 187, 223, 230, 231];
    const RIBBON = [88, 125, 161, 197, 204, 211];
    const HEART_COLORS = [161, 197, 204, 205, 211, 218];
    const MSG_COLORS = [161, 168, 205, 211, 218, 225, 218, 211, 205, 168];
    const SHADE = ".:-=+*%@";
    const PETAL_SHADE = "+*#%";

    // Converte codici colore ANSI 256 in esadecimale CSS
    const ANSI_CACHE = {};
    function ansiToHex(code) {
      if (ANSI_CACHE[code]) return ANSI_CACHE[code];
      let r, g, b;
      if (code >= 16 && code <= 231) {
        const c = code - 16;
        const levels = [0, 95, 135, 175, 215, 255];
        r = levels[Math.floor(c / 36)];
        g = levels[Math.floor((c % 36) / 6)];
        b = levels[c % 6];
      } else if (code >= 232 && code <= 255) {
        const v = 8 + (code - 232) * 10;
        r = g = b = v;
      } else {
        r = g = b = 255;
      }
      const hex = "#" + [r, g, b].map(x => x.toString(16).padStart(2, "0")).join("");
      ANSI_CACHE[code] = hex;
      return hex;
    }

    // Generatore pseudo-casuale deterministico (seed = 21 come nel Python)
    function mulberry32(seed) {
      return function() {
        let t = seed += 0x6D2B79F5;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    const _L = [-0.45, 0.6, 0.66];
    const _n = Math.hypot(..._L);
    const [LX, LY, LZ] = _L.map(v => v / _n);

    const DISC_TYPES = [
      [WHITE, GOLD_CENTER, 13],
      [PINK, GOLD_CENTER, 8],
      [RED, DARK_CENTER, 6],
      [PURPLE, GOLD_CENTER, 7],
      [YELLOW, DARK_CENTER, 12],
      [ORANGE, DARK_CENTER, 9],
    ];
    const TULIP_COLORS = [RED, PINK, YELLOW];

    function norm(v) {
      const m = Math.hypot(v[0], v[1], v[2]) || 1.0;
      return [v[0] / m, v[1] / m, v[2] / m];
    }

    function cross(a, b) {
      return [
        a[1] * b[2] - a[2] * b[1],
        a[2] * b[0] - a[0] * b[2],
        a[0] * b[1] - a[1] * b[0]
      ];
    }

    function add(p, d, k) {
      return [p[0] + d[0] * k, p[1] + d[1] * k, p[2] + d[2] * k];
    }

    function buildScene() {
      const rnd = mulberry32(21);
      const pts = [];
      const neck = [0.0, -0.12, 0.0];
      const C = [0.0, 0.12, 0.0], D = 0.64, N = 10;
      const golden = Math.PI * (3 - Math.sqrt(5));
      const heads = [];

      for (let i = 0; i < N; i++) {
        const el = (88 - 60 * Math.sqrt(i / (N - 1))) * Math.PI / 180;
        const az = i * golden;
        const d = [Math.cos(el) * Math.cos(az), Math.sin(el), Math.cos(el) * Math.sin(az)];
        const pos = add(C, d, D * (0.92 + rnd() * 0.13));
        heads.push([pos, norm(d)]);
      }

      const tulipSlots = new Set([3, 8]);
      const flowers = [];
      let discI = 0, tulipCount = 0;

      heads.forEach(([pos, axis], idx) => {
        const base = add(pos, axis, -0.03);
        for (let j = 0; j < 70; j++) {
          const t = j / 69;
          const p = [
            base[0] + (neck[0] - base[0]) * t,
            base[1] + (neck[1] - base[1]) * t,
            base[2] + (neck[2] - base[2]) * t
          ];
          pts.push([p[0], p[1], p[2], axis[0], 0.0, axis[2], GREENS, -0.15, true, null]);
        }
        if (tulipSlots.has(idx)) {
          flowers.push([pos, "tulip", TULIP_COLORS[tulipCount++ % TULIP_COLORS.length], null, 0, 0.11, rnd() * 6.28]);
        } else {
          const [petals, center, nPet] = DISC_TYPES[discI++ % DISC_TYPES.length];
          flowers.push([pos, "disc", petals, center, nPet, 0.12 + rnd() * 0.02, rnd() * 6.28]);
        }
      });

      for (let i = 0; i < 8; i++) {
        const a = (i + 0.4) / 8 * 2 * Math.PI;
        const c = Math.cos(a), s = Math.sin(a);
        const base = [0.26 * c, 0.30, 0.26 * s];
        const d = norm([c, 0.15, s]);
        const side = [-s, 0.0, c];
        const n = norm(cross(side, d));
        const L = 0.30, W = 0.07;
        for (let ti = 0; ti < 32; ti++) {
          const t = ti / 31;
          for (let wi = -5; wi <= 5; wi++) {
            const w = wi / 5;
            const curl = 0.025 * w * w;
            const p = [
              base[0] + d[0] * L * t + side[0] * W * Math.sin(Math.PI * t) * w + n[0] * curl,
              base[1] + d[1] * L * t - 0.10 * t * t + n[1] * curl,
              base[2] + d[2] * L * t + side[2] * W * Math.sin(Math.PI * t) * w + n[2] * curl
            ];
            pts.push([p[0], p[1], p[2], n[0], n[1], n[2], GREENS, wi === 0 ? -0.25 : 0.0, true, null]);
          }
        }
      }

      const y0 = -0.20, y1 = 0.30, r0 = 0.06, r1 = 0.36;
      const k = (r1 - r0) / (y1 - y0);
      const rings = 50;
      for (let i = 0; i < rings; i++) {
        const t = i / (rings - 1);
        const r = r0 + (r1 - r0) * t;
        const count = Math.max(8, Math.floor(170 * r));
        for (let j = 0; j < count; j++) {
          const ph = (j + rnd()) / count * 2 * Math.PI;
          const c = Math.cos(ph), s = Math.sin(ph);
          let y = y0 + (y1 - y0) * t;
          if (t > 0.9) y += 0.03 * Math.sin(9 * ph);
          const fold = 0.3 * (Math.abs(Math.sin(5 * ph)) - 0.6);
          const nn = norm([c, -k, s]);
          pts.push([r * c, y, r * s, nn[0], nn[1], nn[2], PAPER, fold, false, null]);
        }
      }

      for (let i = 0; i < 7; i++) {
        const a = i / 7 * 2 * Math.PI;
        const sx = 0.025 * Math.cos(a), sz = 0.025 * Math.sin(a);
        for (let j = 0; j < 40; j++) {
          const t = j / 39;
          pts.push([sx * (1 + 1.2 * t), -0.20 - 0.30 * t, sz * (1 + 1.2 * t),
                    Math.cos(a), 0.0, Math.sin(a), GREENS, -0.1, true, null]);
        }
      }

      const by = -0.12;
      const br = r0 + k * (by - y0) + 0.01;
      for (let j = 0; j < 90; j++) {
        const ph = j / 90 * 2 * Math.PI;
        for (const dy of [-0.012, 0.0, 0.012]) {
          pts.push([br * Math.cos(ph), by + dy, br * Math.sin(ph),
                    Math.cos(ph), 0.0, Math.sin(ph), RIBBON, 0.0, false, null]);
        }
      }

      const knot = [0.0, by, br + 0.01];
      for (const side of [-1, 1]) {
        for (let j = 0; j < 70; j++) {
          const a = j / 70 * 2 * Math.PI;
          const lx = side * (0.07 + 0.07 * Math.cos(a));
          const ly = 0.04 * Math.sin(a) + 0.02 * (0.07 + 0.07 * Math.cos(a)) / 0.14;
          for (const fill of [1.0, 0.7]) {
            pts.push([knot[0] + lx * fill, knot[1] + ly * fill, knot[2] + 0.01,
                      side * 0.3, 0.2, 0.93, RIBBON, 0.1, true, null]);
          }
        }
        for (let j = 0; j < 30; j++) {
          const t = j / 29;
          pts.push([knot[0] + side * 0.06 * t, knot[1] - 0.15 * t, knot[2] + 0.015,
                    side * 0.2, 0.0, 0.98, RIBBON, -0.05 + 0.05 * Math.sin(t * 9), true, null]);
        }
      }
      for (const dx of [-0.01, 0.0, 0.01]) {
        pts.push([dx, by, knot[2] + 0.02, 0, 0, 1, RIBBON, 0.2, true, "@"]);
      }

      const babies = [];
      for (let i = 0; i < 90; i++) {
        const a = rnd() * 2 * Math.PI;
        const el = 0.3 + rnd() * 1.1;
        const rr = 0.40 + rnd() * 0.18;
        babies.push([rr * Math.cos(a) * Math.cos(el), C[1] + rr * Math.sin(el),
                     rr * Math.sin(a) * Math.cos(el), rnd() * 6.28]);
      }

      const sparkles = [];
      for (let i = 0; i < 30; i++) {
        const a = rnd() * 2 * Math.PI;
        const rr = 0.75 + rnd() * 0.20;
        sparkles.push([rr * Math.cos(a), -0.3 + rnd() * 1.3, rr * Math.sin(a),
                       rnd() * 6.28, 1.5 + rnd() * 2.5]);
      }

      return { pts, flowers, babies, sparkles };
    }

    const scene = buildScene();
    const hearts = [];
    const screenEl = document.getElementById("screen");

    function updateHearts(dt) {
      while (hearts.length < NUM_HEARTS) {
        hearts.push([
          Math.random(),
          1.0 + Math.random(),
          0.03 + Math.random() * 0.05,
          Math.random() * 6.28,
          HEART_COLORS[Math.floor(Math.random() * HEART_COLORS.length)]
        ]);
      }
      for (const h of hearts) {
        h[1] -= h[2] * dt;
        if (h[1] < 0) {
          h[0] = Math.random();
          h[1] = 1.0;
          h[4] = HEART_COLORS[Math.floor(Math.random() * HEART_COLORS.length)];
        }
      }
    }

    function escapeHtml(ch) {
      if (ch === "<") return "&lt;";
      if (ch === ">") return "&gt;";
      if (ch === "&") return "&amp;";
      return ch;
    }

    function render(t, cols, rows) {
      const { pts, flowers, babies, sparkles } = scene;
      const chars = Array.from({ length: rows }, () => Array(cols).fill(" "));
      const colors = Array.from({ length: rows }, () => Array(cols).fill(0));
      const zbuf = Array.from({ length: rows }, () => Array(cols).fill(-1e9));

      const viewRows = rows - 2;
      const scale = Math.max(1.0, Math.min((viewRows - 2) / 1.45, (cols - 2) / 2.7));
      const sxScale = scale * 2.0;
      const cx = cols / 2;
      const cy = 1 + 0.78 * scale;

      const ang = t * SPIN_SPEED;
      const ca = Math.cos(ang), sa = Math.sin(ang);
      const ct = Math.cos(TILT), st = Math.sin(TILT);

      function project(x, y, z) {
        const xr = x * ca - z * sa;
        const zr = x * sa + z * ca;
        const yp = y - PIVOT_Y;
        const yt = yp * ct - zr * st;
        const zt = yp * st + zr * ct;
        const f = CAM_DIST / (CAM_DIST - zt);
        return [Math.floor(cx + xr * f * sxScale), Math.floor(cy - yt * f * scale), zt, f];
      }

      function projectF(x, y, z) {
        const xr = x * ca - z * sa;
        const zr = x * sa + z * ca;
        const yp = y - PIVOT_Y;
        const yt = yp * ct - zr * st;
        const zt = yp * st + zr * ct;
        const f = CAM_DIST / (CAM_DIST - zt);
        return [cx + xr * f * sxScale, cy - yt * f * scale, zt, f];
      }

      function plot(col, row, z, ch, color) {
        if (row >= 0 && row < viewRows && col >= 0 && col < cols && z > zbuf[row][col]) {
          zbuf[row][col] = z;
          chars[row][col] = ch;
          colors[row][col] = color;
        }
      }

      for (const [x, y, , phase, color] of hearts) {
        const col = Math.floor(((x + 0.015 * Math.sin(t * 1.2 + phase)) % 1 + 1) % 1 * cols);
        plot(col, Math.floor(y * viewRows), -50, "♥", color);
      }

      for (const [x, y, z, nx, ny, nz, pal, tone, twoSided, override] of pts) {
        const [col, row, zt] = project(x, y, z);
        const nxr = nx * ca - nz * sa;
        const nzr = nx * sa + nz * ca;
        const nyt = ny * ct - nzr * st;
        const nzt = ny * st + nzr * ct;
        let dot = nxr * LX + nyt * LY + nzt * LZ;
        if (twoSided && dot < 0) dot = -dot * 0.55;
        let b = 0.25 + 0.75 * Math.max(0.0, dot) + tone;
        b = Math.min(0.999, Math.max(0.0, b));
        const ch = override || SHADE[Math.floor(b * SHADE.length)];
        plot(col, row, zt, ch, pal[Math.floor(b * pal.length)]);
      }

      for (const [[x, y, z], kind, pal, cpal, nPet, R, seed] of flowers) {
        const [fx, fy, zt, f] = projectF(x, y, z);
        const rx = R * f * sxScale, ry = R * f * scale;
        const dim = -0.4 * (1 - Math.min(1.0, Math.max(0.0, (zt + 0.6) / 1.2)));
        const rot = seed + ang * 0.7;

        for (let row = Math.floor(fy - ry) - 1; row <= Math.floor(fy + ry) + 1; row++) {
          const dy = (row + 0.5 - fy) / ry;
          for (let col = Math.floor(fx - rx) - 1; col <= Math.floor(fx + rx) + 1; col++) {
            const dx = (col + 0.5 - fx) / rx;
            if (kind === "disc") {
              const s = Math.hypot(dx, dy);
              if (s > 1.0) continue;
              if (s < 0.3) {
                let b = Math.min(0.999, Math.max(0.0, 0.55 - 0.35 * dx - 0.35 * dy + dim));
                plot(col, row, zt + 0.06, s < 0.17 ? "@" : "o", cpal[Math.floor(b * cpal.length)]);
                continue;
              }
              const ph = Math.atan2(dy, dx);
              const reach = 0.32 + 0.68 * Math.pow(Math.abs(Math.cos(nPet * (ph + rot) / 2)), 0.7);
              if (s > reach) continue;
              const edge = s > reach - 0.14 ? -0.22 : 0.0;
              let b = Math.min(0.999, Math.max(0.0, 0.62 - 0.22 * dx - 0.28 * dy + 0.12 * s + edge + dim));
              plot(col, row, zt + 0.04 * (1 - s), PETAL_SHADE[Math.floor(b * PETAL_SHADE.length)], pal[Math.floor(b * pal.length)]);
            } else {
              const v = (1 - dy) / 2;
              if (v < 0 || v > 1) continue;
              const hw = 0.62 * Math.sin(Math.PI * 0.5 * Math.min(1.0, v * 1.5 + 0.05));
              if (hw <= 0 || Math.abs(dx) > hw) continue;
              const xn = dx / hw;
              if (v > 0.72 + 0.28 * Math.pow(Math.cos(1.5 * Math.PI * xn), 2)) continue;
              const seam = (Math.abs(Math.abs(xn) - 0.33) < 0.12 && v > 0.3) ? -0.25 : 0.0;
              let b = Math.min(0.999, Math.max(0.0, 0.55 - 0.3 * xn + 0.1 * v + seam + dim));
              plot(col, row, zt + 0.03, PETAL_SHADE[Math.floor(b * PETAL_SHADE.length)], pal[Math.floor(b * pal.length)]);
            }
          }
        }
      }

      for (const [x, y, z, phase] of babies) {
        const [col, row, zt] = project(x, y, z);
        const star = Math.sin(t * 2 + phase) > 0.6;
        plot(col, row, zt + 0.02, star ? "*" : "·", star ? 231 : 255);
      }

      for (const [x, y, z, phase, speed] of sparkles) {
        const [col, row, zt] = project(x, y, z);
        const tw = Math.sin(t * speed + phase);
        if (tw > 0.85) plot(col, row, zt, "*", 231);
        else if (tw > 0.4) plot(col, row, zt, "+", 225);
        else if (tw > 0.0) plot(col, row, zt, "·", 218);
      }

      const mrow = rows - 2;
      const start = Math.max(0, Math.floor((cols - MESSAGE.length) / 2));
      const shift = Math.floor(t * 6);
      for (let i = 0; i < MESSAGE.length; i++) {
        if (start + i < cols) {
          chars[mrow][start + i] = MESSAGE[i];
          colors[mrow][start + i] = MSG_COLORS[(i + shift) % MSG_COLORS.length];
        }
      }
      const hstart = Math.max(0, Math.floor((cols - HINT.length) / 2));
      for (let i = 0; i < HINT.length; i++) {
        if (hstart + i < cols) {
          chars[rows - 1][hstart + i] = HINT[i];
          colors[rows - 1][hstart + i] = 244;
        }
      }

      const htmlLines = [];
      for (let r = 0; r < rows; r++) {
        const rc = chars[r], rcol = colors[r];
        let last = -1;
        let line = "";
        for (let c = 0; c < cols; c++) {
          const ch = rc[c];
          if (ch !== " " && rcol[c] !== last) {
            if (last !== -1) line += "</span>";
            last = rcol[c];
            line += `<span style="color:${ansiToHex(last)}">`;
          }
          line += escapeHtml(ch);
        }
        if (last !== -1) line += "</span>";
        htmlLines.push(line);
      }
      return htmlLines.join("\n");
    }

    // Adatta dimensione carattere a schermo PC o telefono
    function getGridSize() {
      const isMobile = window.innerWidth < 600;
      const fontSize = isMobile ? 8 : 13;
      screenEl.style.fontSize = fontSize + "px";
      const charW = fontSize * 0.6;
      const charH = fontSize * 1.05;
      const cols = Math.max(48, Math.floor((window.innerWidth - 10) / charW));
      const rows = Math.max(32, Math.floor((window.innerHeight - 10) / charH));
      return [cols, rows];
    }

    let start = performance.now();
    let last = start;

    function loop(now) {
      const dt = (now - last) / 1000;
      last = now;
      const [cols, rows] = getGridSize();
      updateHearts(dt);
      screenEl.innerHTML = render((now - start) / 1000, cols, rows);
      setTimeout(() => requestAnimationFrame(loop), 1000 / 24);
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
